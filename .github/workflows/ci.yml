# Cổng chất lượng của checklist DoD (.claude/skills/dod-report/SKILL.md) trên mọi push và pull request.
# Độ phủ 100% chỉ áp cho file bị đổi so với nhánh đích (mục 2a), giống CI của medicine-management.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mốc so "file bị đổi": nhánh đích của PR, không thì main (trên chính main thì diff rỗng).
  GATE_BASE: origin/${{ github.base_ref || 'main' }}

jobs:
  check:
    name: Lint, kiểu, unit test + độ phủ, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm -r test:coverage
      - name: Độ phủ 100% file bị đổi
        run: node scripts/coverage-changed.mjs "$GATE_BASE"
      - run: pnpm build

  tts-tool:
    name: Công cụ tạo âm thanh (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
        working-directory: tools/tts

  e2e:
    name: E2E (Playwright, máy tính + điện thoại, offline)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @study/game exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: apps/game/test-results
          retention-days: 7
